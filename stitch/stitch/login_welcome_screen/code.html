<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Receipt Flow</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-highest": "#e1e3e4",
              "inverse-primary": "#66dd8b",
              "on-error": "#ffffff",
              "on-tertiary-fixed": "#2f1500",
              "inverse-on-surface": "#f0f1f2",
              "outline-variant": "#bdcabc",
              "secondary": "#446464",
              "secondary-container": "#c6e9e9",
              "surface-container-low": "#f3f4f5",
              "on-primary": "#ffffff",
              "surface-bright": "#f8f9fa",
              "primary-fixed-dim": "#66dd8b",
              "primary": "#006d36",
              "surface-container": "#edeeef",
              "surface-tint": "#006d36",
              "tertiary-fixed-dim": "#ffb77d",
              "secondary-fixed": "#c6e9e9",
              "inverse-surface": "#2e3132",
              "surface-dim": "#d9dadb",
              "on-secondary-fixed-variant": "#2c4c4c",
              "surface-container-high": "#e7e8e9",
              "background": "#f8f9fa",
              "on-primary-fixed-variant": "#005227",
              "error-container": "#ffdad6",
              "surface": "#f8f9fa",
              "on-error-container": "#93000a",
              "secondary-fixed-dim": "#abcdcd",
              "on-tertiary-fixed-variant": "#6e3900",
              "on-background": "#191c1d",
              "tertiary-fixed": "#ffdcc3",
              "on-secondary-container": "#4a6a6a",
              "on-tertiary-container": "#6a3700",
              "primary-container": "#50c878",
              "outline": "#6e7a6e",
              "tertiary-container": "#ff993a",
              "surface-container-lowest": "#ffffff",
              "tertiary": "#904d00",
              "error": "#ba1a1a",
              "on-secondary-fixed": "#002020",
              "primary-fixed": "#83fba5",
              "on-surface-variant": "#3e4a3f",
              "surface-variant": "#e1e3e4",
              "on-primary-container": "#005025",
              "on-surface": "#191c1d",
              "on-secondary": "#ffffff",
              "on-tertiary": "#ffffff",
              "on-primary-fixed": "#00210c"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .editorial-shadow {
            box-shadow: 0 20px 40px rgba(25, 28, 29, 0.04);
        }
        .glass-panel {
            background: rgba(248, 249, 250, 0.8);
            backdrop-filter: blur(20px);
        }
        .emerald-gradient {
            background: linear-gradient(135deg, #006d36 0%, #50c878 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-6 selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Suppressed/Minimal as per Shell Visibility Rule for Login) -->
<header class="fixed top-0 w-full z-50 flex justify-center py-10">
<div class="flex flex-col items-center gap-2">
<div class="w-14 h-14 rounded-2xl emerald-gradient flex items-center justify-center shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings: 'wght' 300;">receipt_long</span>
</div>
<h1 class="font-headline font-extrabold text-2xl text-on-surface tracking-tighter">
                Receipt Flow
            </h1>
</div>
</header>
<main class="w-full max-w-md mt-24">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-[32px] p-10 editorial-shadow flex flex-col gap-8">
<div class="space-y-2">
<h2 class="font-headline text-3xl font-bold text-on-surface tracking-tight">Welcome back</h2>
<p class="font-body text-on-surface-variant text-sm">Please enter your details to access your ledger.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-6" onsubmit="return false;">
<div class="space-y-5">
<!-- Email Field -->
<div class="group">
<label class="block font-label text-[11px] font-semibold uppercase tracking-widest text-on-surface-variant mb-2 ml-1" for="email">Email Address</label>
<div class="relative">
<input class="w-full h-14 px-5 rounded-2xl bg-surface-container-highest border-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-200 font-body text-on-surface placeholder:text-outline" id="email" placeholder="alex@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="group">
<div class="flex justify-between items-center mb-2 px-1">
<label class="block font-label text-[11px] font-semibold uppercase tracking-widest text-on-surface-variant" for="password">Password</label>
<a class="font-label text-xs font-semibold text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full h-14 px-5 rounded-2xl bg-surface-container-highest border-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-200 font-body text-on-surface placeholder:text-outline" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
</div>
<button class="w-full h-14 emerald-gradient text-white font-headline font-bold rounded-2xl shadow-lg shadow-primary/20 hover:scale-[0.98] active:scale-95 transition-all duration-200" type="submit">
                    Login
                </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant/20"></div>
<span class="flex-shrink mx-4 font-label text-[10px] uppercase tracking-widest text-outline">Or continue with</span>
<div class="flex-grow border-t border-outline-variant/20"></div>
</div>
<!-- Social Login -->
<button class="w-full h-14 bg-surface-container-low hover:bg-surface-container-high border border-outline-variant/15 text-on-surface font-headline font-semibold rounded-2xl flex items-center justify-center gap-3 transition-colors duration-200">
<svg height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Google
            </button>
</div>
<!-- Footer -->
<div class="mt-8 text-center">
<p class="font-body text-on-surface-variant text-sm">
                Don't have an account? 
                <a class="text-primary font-semibold hover:underline decoration-primary/30 underline-offset-4 ml-1" href="#">Sign Up</a>
</p>
</div>
</main>
<!-- Decorative Elements (Asymmetric Visual Path) -->
<div class="fixed -bottom-20 -left-20 w-80 h-80 rounded-full bg-primary-fixed/10 blur-[100px] pointer-events-none"></div>
<div class="fixed top-1/4 -right-10 w-64 h-64 rounded-full bg-secondary-fixed/10 blur-[80px] pointer-events-none"></div>
<!-- Editorial Accent: Floating Receipts -->
<div class="hidden lg:block fixed left-12 top-1/2 -translate-y-1/2 space-y-8 opacity-40">
<div class="w-48 h-64 bg-surface-container-lowest rounded-xl shadow-sm rotate-[-6deg] flex flex-col p-4 gap-3">
<div class="h-2 w-2/3 bg-surface-container rounded-full"></div>
<div class="h-2 w-1/2 bg-surface-container rounded-full"></div>
<div class="mt-auto flex justify-between">
<div class="h-3 w-8 bg-primary-container rounded-sm"></div>
<div class="h-3 w-12 bg-surface-container-high rounded-sm"></div>
</div>
</div>
<div class="w-40 h-56 bg-surface-container-lowest rounded-xl shadow-sm rotate-[4deg] translate-x-12 flex flex-col p-4 gap-3">
<div class="h-2 w-3/4 bg-surface-container rounded-full"></div>
<div class="h-2 w-1/3 bg-surface-container rounded-full"></div>
<div class="mt-auto flex justify-between">
<div class="h-3 w-10 bg-tertiary-container rounded-sm"></div>
<div class="h-3 w-8 bg-surface-container-high rounded-sm"></div>
</div>
</div>
</div>
</body></html>
